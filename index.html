<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e1f34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Galla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Galla Cash Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: a counter ledger — sticky shop bar, period filter, grouped summary, four tabs */
:root{
  --bg:#f4f5f2; --paper:#ffffff; --ink:#1b2220; --muted:#5f6b67; --line:#dfe3df; --soft:#eceeea;
  --accent:#8e1f34; --accent-ink:#ffffff; --accent-soft:#f6e6e9;
  --good:#1e7a4c; --good-soft:#e3f2ea; --warn:#a2560c; --warn-soft:#fbeedd; --bad:#b4232c;
  --display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --paper:#1a201e; --ink:#e7ece9; --muted:#9aa6a1; --line:#2c3532; --soft:#222a27;
  --accent:#e2768a; --accent-ink:#1a0d10; --accent-soft:#3a1d24;
  --good:#5fcf95; --good-soft:#163024; --warn:#f0a85a; --warn-soft:#3a2a17; --bad:#ff7b82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --paper:#1a201e; --ink:#e7ece9; --muted:#9aa6a1; --line:#2c3532; --soft:#222a27;
  --accent:#e2768a; --accent-ink:#1a0d10; --accent-soft:#3a1d24;
  --good:#5fcf95; --good-soft:#163024; --warn:#f0a85a; --warn-soft:#3a2a17; --bad:#ff7b82; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=date],input[type=number],input[type=text],input[type=search]{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:21px;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-radius:6px;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}

#shopSel{border:2px solid var(--accent);border-radius:8px;font-weight:600;color:var(--accent);background:var(--paper);padding:6px 10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.shoplist .it{flex-wrap:wrap}
.scalebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.scalebar .link{color:var(--accent)}

.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.quick button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none}
.plabel{font-family:var(--display);font-weight:600;font-size:17px;text-align:center;min-width:10ch}
.custom{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

.status{font-size:13px;color:var(--muted);padding-top:10px}
.status.err{color:var(--bad)}

.summary{display:grid;gap:10px;margin-top:14px}
.group{display:grid;grid-template-columns:96px repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.glabel{background:var(--soft);padding:12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center}
.tile{background:var(--paper);padding:10px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;overflow-wrap:anywhere}
.tile .s{font-size:11px;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-ink)}
.tile.hero .k,.tile.hero .s{color:inherit;opacity:.85}
@media (max-width:760px){.group{grid-template-columns:repeat(2,minmax(0,1fr))}.glabel{grid-column:1/-1;padding:6px 12px}.tile .v{font-size:16px}}

.panel{padding-top:16px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:840px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:17px}
.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.step{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
form.f{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.fl input,label.fl select{width:100%;color:var(--ink);font-size:16px}
input.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[readonly]{background:var(--soft)}
.tick{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
details.more{border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.more[open] summary{margin-bottom:8px}
.btn{border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:500}
.btn.small{padding:6px 10px;font-size:13px}
.btn.warnbtn{background:var(--warn);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{font-size:13px;border-radius:6px;padding:8px 10px;background:var(--soft);color:var(--muted)}
.check.ok{background:var(--good-soft);color:var(--good)}
.check.off{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:140px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--soft)}
td.r,th.r{text-align:right}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.total td{font-weight:600;background:var(--soft)}
tr.bf td{color:var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
th.bal,td.bal{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.link{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;text-decoration:underline}
.link:hover{color:var(--ink)}
.link.del:hover{color:var(--bad)}
.empty{color:var(--muted);font-size:14px;padding:16px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:6px;padding:6px 10px;font-size:13px;display:flex;gap:8px}
.chip b{font-family:var(--mono);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.confirm{display:inline-flex;gap:4px;align-items:center;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.shoplist{display:grid;gap:8px}
.shoplist .it{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shoplist input[type=text]{flex:1}
.ledger td:first-child{white-space:normal}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.gate{max-width:420px;margin:48px auto 0;display:grid;gap:16px}
.gate h2{font-size:24px}
.userpick{display:grid;gap:8px}
.userpick button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 14px;cursor:pointer}
.userpick button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.userpick .role{font-size:12px;color:var(--muted)}
input.pin{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center;width:100%}
.lockmsg{font-size:13px;border-radius:6px;padding:10px;background:var(--soft);color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb .x{position:absolute;top:2px;right:2px;border:0;background:var(--ink);color:var(--bg);border-radius:99px;width:20px;height:20px;line-height:18px;cursor:pointer;font-size:13px;padding:0}
.thumb.add{border-style:dashed;cursor:pointer}
.mini{display:flex;gap:4px}
.mini img{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in}
.alert{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.alert h2{font-size:16px;color:var(--warn)}
.chg{font-size:13px}
.chg b{font-family:var(--mono);font-weight:500}
.chg .old{text-decoration:line-through;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,12,12,.92);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.lb[hidden]{display:none!important}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px;flex-wrap:wrap}
.lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:10px}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:var(--paper);font-size:11px;line-height:18px;text-align:center;margin-left:4px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;min-width:0}
legend{font-size:12px;color:var(--muted);padding:0 4px}
.brand{align-items:center}
#installBtn{font-size:12px;padding:5px 10px}
.ioshint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:14px;display:grid;gap:8px}
.ioshint b{font-family:var(--display);font-size:16px}
.offline-dot{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
@media (display-mode:standalone){#installBtn{display:none!important}}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 4px}
.sugg:empty{display:none}
.hlist{display:grid;border-top:1px solid var(--line)}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.hn{display:grid;gap:2px;min-width:0}.hn b{font-weight:600;overflow-wrap:anywhere}
.ha{display:flex;gap:12px;align-items:center;flex-shrink:0}
.sugg .sg{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.sugg .sg small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sugg .sg:hover{border-color:var(--accent)}
.sugg .sg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sugg .sgnew{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:5px 8px;width:100%}
:root{--accent2:#b4304f}
body{background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--accent-soft) 85%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
header.bar{border-top:4px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--accent2)) 1;border-bottom-color:color-mix(in srgb,var(--accent) 18%,var(--line));background:color-mix(in srgb,var(--accent-soft) 70%,var(--bg));backdrop-filter:saturate(1.2)}
.brand h1{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn:not(.ghost){background:linear-gradient(135deg,var(--accent),var(--accent2))}
.tile.hero{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.card{border-top:3px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swatches button{width:32px;height:32px}
.swname{width:100%}
.boxcalc{display:grid;gap:4px;font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px}
.boxcalc .ln{display:flex;justify-content:space-between;gap:8px}
.boxcalc .ln.tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.boxres{border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.boxres.ok{background:var(--good-soft);color:var(--good)}
.boxres.up{background:color-mix(in srgb,var(--good-soft) 70%,var(--paper));color:var(--good)}
.boxres.down{background:var(--warn-soft);color:var(--warn)}
.btn.warnbtn{background:var(--warn);color:var(--paper)}

/* Colourful tiles: each kind of money has its own colour */
:root{
  --c-cash:#0f8a4f;--c-cash-bg:#e6f7ee;--c-upi:#2463d6;--c-upi-bg:#e8f0fe;--c-due:#c46a00;--c-due-bg:#fff2dc;
  --c-exp:#d0344f;--c-exp-bg:#fde8ec;--c-sal:#7b3fd6;--c-sal-bg:#f1e9fd;--c-party:#0b8a8a;--c-party-bg:#e0f6f5;--c-out:#475569;--c-out-bg:#eef1f5;--c-pos:#a23ad1;--c-pos-bg:#f6e8fc;
  --g-cash:linear-gradient(135deg,#0f9d58,#34c47c);--g-bank:linear-gradient(135deg,#2b5ce6,#5b8cff);--g-due:linear-gradient(135deg,#e07a00,#f5a524);--g-pos:linear-gradient(135deg,#8b2fc9,#d14fd0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-cash:#5fd99a;--c-cash-bg:#132a1f;--c-upi:#8db4ff;--c-upi-bg:#16213a;--c-due:#f7b955;--c-due-bg:#2e2312;
  --c-exp:#ff8da0;--c-exp-bg:#33161d;--c-sal:#c4a1ff;--c-sal-bg:#241a38;--c-party:#5fd6d4;--c-party-bg:#112c2c;--c-out:#b4c0d0;--c-out-bg:#1d242d;--c-pos:#e09bff;--c-pos-bg:#2c1937;
  --g-cash:linear-gradient(135deg,#0c7a45,#1fa565);--g-bank:linear-gradient(135deg,#2048b8,#3d6fe0);--g-due:linear-gradient(135deg,#a85a00,#cc8410);--g-pos:linear-gradient(135deg,#6c2399,#a53aa4)}}
:root[data-theme="dark"]{
  --c-cash:#5fd99a;--c-cash-bg:#132a1f;--c-upi:#8db4ff;--c-upi-bg:#16213a;--c-due:#f7b955;--c-due-bg:#2e2312;
  --c-exp:#ff8da0;--c-exp-bg:#33161d;--c-sal:#c4a1ff;--c-sal-bg:#241a38;--c-party:#5fd6d4;--c-party-bg:#112c2c;--c-out:#b4c0d0;--c-out-bg:#1d242d;--c-pos:#e09bff;--c-pos-bg:#2c1937;
  --g-cash:linear-gradient(135deg,#0c7a45,#1fa565);--g-bank:linear-gradient(135deg,#2048b8,#3d6fe0);--g-due:linear-gradient(135deg,#a85a00,#cc8410);--g-pos:linear-gradient(135deg,#6c2399,#a53aa4)}
.group{gap:6px;background:transparent;border:0;border-radius:0;overflow:visible}
.glabel{background:transparent;padding:4px 2px;font-size:11.5px;font-weight:700}
.glabel.g-sales{color:var(--accent)}.glabel.g-out{color:var(--c-exp)}.glabel.g-bal{color:var(--c-cash)}
.tile{border-radius:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.tile[class*=" t-"]{border-color:transparent}
.tile.t-cash{background:var(--c-cash-bg)}.tile.t-cash .v{color:var(--c-cash)}
.tile.t-upi{background:var(--c-upi-bg)}.tile.t-upi .v{color:var(--c-upi)}
.tile.t-due{background:var(--c-due-bg)}.tile.t-due .v{color:var(--c-due)}
.tile.t-exp{background:var(--c-exp-bg)}.tile.t-exp .v{color:var(--c-exp)}
.tile.t-sal{background:var(--c-sal-bg)}.tile.t-sal .v{color:var(--c-sal)}
.tile.t-party{background:var(--c-party-bg)}.tile.t-party .v{color:var(--c-party)}
.tile.t-out{background:var(--c-out-bg)}.tile.t-out .v{color:var(--c-out)}
.tile.b-cash,.tile.b-bank,.tile.b-due,.tile.b-pos{color:#fff;box-shadow:0 6px 16px -10px rgba(0,0,0,.45)}
.tile.b-cash{background:var(--g-cash)}.tile.b-bank{background:var(--g-bank)}.tile.b-due{background:var(--g-due)}.tile.b-pos{background:var(--g-pos)}
.tile.b-cash .k,.tile.b-cash .s,.tile.b-bank .k,.tile.b-bank .s,.tile.b-due .k,.tile.b-due .s,.tile.b-pos .k,.tile.b-pos .s{color:#fff;opacity:.9}

async function hashPin(pin,salt){
  const txt="galla|"+salt+"|"+pin;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))|0;return "d"+(h>>>0).toString(16)}
}

let state={shop:null,tab:"entry",entryDate:todayStr(),preset:"thismonth",unit:"month",from:"",to:"",
  pay:{type:"expense",editId:null},pf:{type:"all",mode:"all",q:""},af:{group:"auto",issues:false}};
try{const s=JSON.parse(localStorage.getItem("galla-ui2")||"{}");if(s.tab)state.tab=s.tab;if(s.shop)state.shop=s.shop;if(s.preset&&s.preset!=="custom")state.preset=s.preset;}catch(e){}
setPreset(state.preset,true);

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,"0")}
function fmtD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return fmtD(new Date())}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmtD(d)}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
const inr=new Intl.NumberFormat("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2});
function r2(v){return Math.round((+v||0)*100)/100}
let SCALE=1,scaleOff=false;
function rs(n){n=r2(n);if(SCALE>1)n=Math.round(n/SCALE*100)/100;return (n<0?"−₹":"₹")+inr.format(Math.abs(n))}
/* Number view: show amounts ÷100 or ÷1000 for a date range (display only, saved data never changes) */
function scaleFor(){

  if(state.tab==="entry"||state.tab==="settings")return 1;

}
const SCALE_NAME={100:"hundreds (÷100)",1000:"thousands (÷1000)"};
/* Each business gets its own colour */
/* n: name · l: light [accent, accent2, soft] · d: dark [accent, accent2, soft] */
const PALETTE={
  maroon:{n:"Rosy maroon",l:["#8e1f34","#b4304f","#f8e4e9"],d:["#e2768a","#f09aa9","#3a1d26"]},
  rose:{n:"Rose pink",l:["#b0124f","#d6336c","#fde6ef"],d:["#f27aa3","#f8a5c2","#3d1a29"]},
  coral:{n:"Coral sunset",l:["#b83a1b","#c94824","#ffe9e1"],d:["#f59273","#f8b29a","#3d2219"]},
  marigold:{n:"Marigold",l:["#a14b06","#b05a05","#fff0d9"],d:["#f5ad4a","#f8c97a","#3a2a14"]},
  emerald:{n:"Emerald",l:["#04704f","#088560","#ddf6ec"],d:["#4fd3a5","#86e5c2","#123126"]},
  forest:{n:"Fresh leaf",l:["#3b5e14","#557f19","#ebf5dc"],d:["#9fd36a","#c0e597","#1f2d14"]},
  peacock:{n:"Peacock",l:["#0e6b73","#0b7f93","#dcf4f5"],d:["#4fd0d8","#86e2e8","#10302f"]},
  ocean:{n:"Ocean blue",l:["#0b5f99","#1676bd","#e0f0fb"],d:["#6cc0f2","#9dd5f7","#132b3d"]},
  royal:{n:"Royal indigo",l:["#3f37c9","#5b45e0","#e9e8ff"],d:["#a5a0ff","#c3bfff","#211f45"]},
  lavender:{n:"Lavender",l:["#7a2bc4","#9333ea","#f3e9fe"],d:["#c9a2fb","#dcc3fd","#2b1f3d"]},
  berry:{n:"Berry",l:["#8e1a62","#b0207c","#fbe6f3"],d:["#ec84c6","#f3abd9","#38192e"]},
  midnight:{n:"Midnight",l:["#1f3a64","#2f5490","#e4ebf6"],d:["#93b4e6","#b6cdf0","#18253a"]}};
const OLDKEY={teal:"peacock",blue:"ocean",green:"emerald",purple:"royal",orange:"marigold",pink:"rose",slate:"midnight"};
const PKEYS=Object.keys(PALETTE);
const DEFAULT_ORDER=["maroon","peacock","marigold","royal","emerald","rose","ocean","coral","lavender","forest","berry","midnight"];
function shopColor(id){const shops=settings.shops||[],i=shops.findIndex(s=>s.id===id);if(i<0)return "maroon";const c=OLDKEY[shops[i].color]||shops[i].color;return PALETTE[c]?c:DEFAULT_ORDER[i%DEFAULT_ORDER.length]}
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(key){
  key=key||(state.shop?shopColor(state.shop):"maroon");applyTheme.cur=key;
  const root=document.documentElement,t=root.dataset.theme,dark=t==="dark"||(t!=="light"&&darkMQ.matches);
  const [a,a2,soft]=PALETTE[key][dark?"d":"l"];
  root.style.setProperty("--accent",a);root.style.setProperty("--accent2",a2);root.style.setProperty("--accent-soft",soft);root.style.setProperty("--accent-ink",dark?"#10141a":"#ffffff");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#121615":a;
}
darkMQ.addEventListener&&darkMQ.addEventListener("change",()=>applyTheme(applyTheme.cur));
function num(v){const n=parseFloat(v);return isFinite(n)?r2(n):0}
function hasVal(v){return v!==undefined&&v!==null&&v!==""}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function niceDate(s){const d=parse(s);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function shortDate(s){const d=parse(s);return d.toLocaleDateString("en-IN",{weekday:"short"})+" "+d.getDate()+" "+MON[d.getMonth()]}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function setStatus(msg,err){const s=$("#status");s.textContent=msg||"";s.className="status"+(err?" err":"");s.hidden=!msg}
function slug(s){return (s||"shop").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"shop"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function field(id,label,val,extra=""){return `<label class="fl">${label}<input class="amt" type="number" inputmode="decimal" step="0.01" min="0" id="${id}" value="${hasVal(val)?esc(val):""}" ${extra}></label>`}

/* ---------- period filter ---------- */
function setPreset(p,silent){
  const t=todayStr(),d=parse(t),y=d.getFullYear(),m=d.getMonth()+1;
  state.preset=p;
  if(p==="today"){state.unit="day";state.from=state.to=t}
  else if(p==="yesterday"){state.unit="day";state.from=state.to=addDays(t,-1)}
  else if(p==="thismonth"){state.unit="month";state.from=`${y}-${pad(m)}-01`;state.to=`${y}-${pad(m)}-${pad(lastDay(y,m))}`}
  else if(p==="lastmonth"){const ly=m===1?y-1:y,lm=m===1?12:m-1;state.unit="month";state.from=`${ly}-${pad(lm)}-01`;state.to=`${ly}-${pad(lm)}-${pad(lastDay(ly,lm))}`}
  else if(p==="thisyear"){state.unit="year";state.from=`${y}-01-01`;state.to=`${y}-12-31`}
  else if(p==="custom"){state.unit="custom"}
  if(!silent) render();
}
function shift(dir){
  const u=state.unit;
  if(u==="day"){state.from=state.to=addDays(state.from,dir)}
  else if(u==="month"){const d=parse(state.from);d.setMonth(d.getMonth()+dir);const y=d.getFullYear(),m=d.getMonth()+1;state.from=`${y}-${pad(m)}-01`;state.to=`${y}-${pad(m)}-${pad(lastDay(y,m))}`}
  else if(u==="year"){const y=+state.from.slice(0,4)+dir;state.from=`${y}-01-01`;state.to=`${y}-12-31`}
  else{const n=daysBetween(state.from,state.to)+1;state.from=addDays(state.from,dir*n);state.to=addDays(state.to,dir*n)}
  state.preset=matchPreset();render();
}
function matchPreset(){
  const keep=state.unit==="custom"?"custom":null;
  for(const p of ["today","yesterday","thismonth","lastmonth","thisyear"]){const s={...state};const f=state.from,t=state.to,u=state.unit;setPreset(p,true);const ok=state.from===f&&state.to===t;state.from=f;state.to=t;state.unit=u;state.preset=s.preset;if(ok)return p}
  return keep||"none";
}
function periodLabel(){
  const f=state.from,t=state.to,d=parse(f);
  if(state.unit==="day") return shortDate(f)+" "+d.getFullYear();
  if(state.unit==="month") return MON[d.getMonth()]+" "+d.getFullYear();
  if(state.unit==="year") return String(d.getFullYear());
  return niceDate(f)+" – "+niceDate(t);
}

/* ---------- data ---------- */
function bookId(shop,ym){return shop+"_"+ym}
function shopBooks(shop){return Object.values(books).filter(b=>b&&b.shop===shop)}
function curShop(){return (settings.shops||[]).find(s=>s.id===state.shop)}
function posOn(){const s=curShop();return !!(s&&s.pos)}

/* All sales for a shop, oldest first. For POS shops the day's sale = today's POS reading − previous reading. */
let salesCache=new Map(),cacheBooks=null;
function allSales(shop){
  if(cacheBooks!==books){salesCache=new Map();cacheBooks=books;}
  if(salesCache.has(shop)) return salesCache.get(shop);
  const out=[];
  for(const b of shopBooks(shop)){const s=b.sales||{};for(const dt in s){const e=s[dt];if(!e||e.deleted)continue;out.push({date:dt,...e});}}
  out.sort((a,b)=>a.date<b.date?-1:1);
  /* EOD POS from bills: each day's sale (bills) moves the running POS total.
     A typed EOD reading is an anchor: earlier days are worked back from it (reading − later sales),
     later days carry forward (reading + sales). Two anchors that disagree with the bills between
     them show a "POS vs bills" difference on the later one. "Counter reset" starts a fresh chain. */
  let lastR=null;
  for(const e of out){ // legacy days saved with a reading but no sale amount
    if(hasVal(e.posReading)&&!hasVal(e.total)) e.total=r2((e.posStart||lastR==null?(e.posFull?num(e.posReading):0):num(e.posReading)-lastR)+num(e.ret));
    if(hasVal(e.posReading)) lastR=num(e.posReading);
  }
  const net=e=>r2(num(e.total)-num(e.ret));
  const segs=[];let cur=[];
  out.forEach((e,i)=>{if(e.posStart&&hasVal(e.posReading)&&cur.length){segs.push(cur);cur=[]}cur.push(e)});
  if(cur.length)segs.push(cur);
  for(const seg of segs){
    seg.forEach(e=>{e.posIsStart=false;e.eod=null;e.posDiff=0;e.posPrevAnchor=null});
    if(seg[0].posStart) seg[0].posIsStart=true;
    let anchors=seg.map((e,i)=>hasVal(e.posReading)?i:-1).filter(i=>i>=0);
    /* "Machine is correct": a rebase reading overrides earlier readings from its from-date on;
       those days are worked back from it using the bills (their typed reading is kept for reference) */
    for(let j=seg.length-1;j>=0;j--){const B=seg[j];if(!B.posRebase||!hasVal(B.posReading)||!anchors.includes(j))continue;
      const F=B.posRebaseFrom||seg[0].date;anchors=anchors.filter(i=>!(i<j&&seg[i].date>=F))}
    seg.forEach((e,i)=>{e.posTyped=hasVal(e.posReading)&&!anchors.includes(i)?num(e.posReading):null;e.posJump=0});
    if(!anchors.length) continue;
    for(let i=0;i<seg.length;i++){
      let nx=anchors.find(j=>j>=i);
      const pvA=anchors.filter(j=>j<i).pop();
      // days before a rebase's from-date keep carrying forward from the older reading
      if(nx!==undefined&&nx!==i&&seg[nx].posRebase&&pvA!==undefined&&seg[i].date<(seg[nx].posRebaseFrom||seg[0].date))nx=undefined;
      if(nx!==undefined){let v=num(seg[nx].posReading);for(let k=i+1;k<=nx;k++)v-=net(seg[k]);seg[i].eod=r2(v)}
      else{const pv=anchors.filter(j=>j<i).pop();let v=num(seg[pv].posReading);for(let k=pv+1;k<=i;k++)v+=net(seg[k]);seg[i].eod=r2(v)}
      seg[i].eodAuto=!anchors.includes(i);
    }
    for(let n=1;n<anchors.length;n++){
      const A=seg[anchors[n-1]],B=seg[anchors[n]];let exp=num(A.posReading);
      for(let k=anchors[n-1]+1;k<=anchors[n];k++)exp+=net(seg[k]);
      const d=r2(num(B.posReading)-exp);
      if(B.posRebase){B.posDiff=0;const F=B.posRebaseFrom||seg[0].date;let f=anchors[n-1]+1;while(f<anchors[n]&&seg[f].date<F)f++;if(d)seg[f].posJump=d}
      else{B.posDiff=d;B.posPrevAnchor={r:num(A.posReading),date:A.date}}
    }
    seg.forEach((e,i)=>{e.posDay=net(e)});
  }
  salesCache.set(shop,out);return out;
}
function allPurchases(shop){
  const out=[];
  for(const b of shopBooks(shop)){const s=b.purchases||{};for(const id in s){const e=s[id];if(!e||e.deleted)continue;out.push({id,...e})}}
  return out.sort((a,b)=>a.date===b.date?((a.at||0)-(b.at||0)):(a.date<b.date?-1:1));
}
function salesBetween(shop,from,to){return allSales(shop).filter(e=>e.date>=from&&e.date<=to)}
function readingOf(e){return hasVal(e.eod)?{r:e.eod,date:e.date,auto:!!e.eodAuto,diff:e.posDiff||0,jump:e.posJump||0}:null}
function prevReading(shop,date){let p=null;for(const e of allSales(shop)){if(e.date>=date)break;p=readingOf(e)||p}return p}
function lastReading(shop,upto){let p=null;for(const e of allSales(shop)){if(e.date>upto)break;p=readingOf(e)||p}return p}
function lastRealReading(shop,before){let p=null;for(const e of allSales(shop)){if(e.date>=before)break;if(hasVal(e.posReading))p={r:num(e.posReading),date:e.date}}return p}
function txnsBetween(shop,from,to,type){
  const out=[];
  for(const b of shopBooks(shop)){const t=b.txns||{};for(const id in t){const e=t[id];if(!e||e.deleted)continue;if(type&&e.type!==type)continue;if(e.date>=from&&e.date<=to)out.push({id,...e})}}
  return out.sort((a,b)=>a.date===b.date?((a.at||0)-(b.at||0)):(a.date<b.date?-1:1));
}
function totals(shop,from,to){
  const t={gross:0,ret:0,cash:0,upi:0,unpaid:0,duesCash:0,duesUpi:0,expense:0,salary:0,party:0,cashOut:0,bankOut:0,days:0,openUnpaid:0,cashAdj:0};
  for(const s of salesBetween(shop,from,to)){
    t.gross+=num(s.total);t.ret+=num(s.ret);t.cash+=num(s.cash);t.upi+=num(s.upi);t.unpaid+=num(s.unpaid);
    t.duesCash+=num(s.duesCash);t.duesUpi+=num(s.duesUpi);t.days++;t.cashAdj+=num(s.cashAdj);
    if(s.posIsStart) t.openUnpaid+=num(s.posOpenUnpaid);
  }
  for(const x of txnsBetween(shop,from,to)){t[x.type]+=num(x.amount);if(x.mode==="Cash")t.cashOut+=num(x.amount);else t.bankOut+=num(x.amount)}
  for(const k in t) t[k]=r2(t[k]);
  t.net=r2(t.gross-t.ret);t.out=r2(t.expense+t.salary+t.party);
  t.cashFlow=r2(t.cash+t.duesCash-t.cashOut+t.cashAdj);t.bankFlow=r2(t.upi+t.duesUpi-t.bankOut);
  t.dues=r2(t.duesCash+t.duesUpi);
  return t;
}
function opening(shop){const o=(settings.opening||{})[shop]||{};return {date:o.date||"0000-01-01",cash:num(o.amount),bank:num(o.bank)}}
function cashInHand(shop,upto){const o=opening(shop);if(upto<o.date)return null;return r2(o.cash+totals(shop,o.date,upto).cashFlow)}
function bankBalance(shop,upto){const o=opening(shop);if(upto<o.date)return null;return r2(o.bank+totals(shop,o.date,upto).bankFlow)}
function outstanding(shop,upto){const t=totals(shop,"0000-01-01",upto);return r2(t.openUnpaid+t.unpaid-t.dues)}
function splitDiff(s){return r2(num(s.total)-num(s.ret)-num(s.cash)-num(s.upi)-num(s.unpaid))}
function issuesOf(s){
  const out=[];
  if(!s) return out;
  const d=splitDiff(s);if(d) out.push((d>0?"Split short ":"Split over ")+rs(Math.abs(d)));
  if(posOn()&&s.posDiff)out.push("POS vs bills "+(s.posDiff>0?"+":"−")+rs(Math.abs(s.posDiff)));
  return out;
}

/* ---------- writes ---------- */
async function ensureBook(shop,date){
  const ym=date.slice(0,7),id=bookId(shop,ym),ref=db.doc("books/"+id);
  if(books[id]) return ref;
  const snap=await ref.get();
  if(!snap.exists) await ref.set({shop,month:ym,sales:{},txns:{}});
  return ref;
}
async function write(fn,okMsg){
  if(!db){toast("Saving is unavailable here");return false}
  try{
    const r=await Promise.race([fn().then(()=>"ok"),new Promise(res=>setTimeout(()=>res("queued"),5000))]);
    if(okMsg!==false)toast(r==="queued"?"Saved on this device. It will sync when the internet is back.":(okMsg||"Saved"));return true}
  catch(e){
    if(e&&e.code==="permission-denied") toast("Not allowed to save. Check the Firestore rules (see setup guide).");
    else if(e&&e.code==="quota_exceeded") toast("Storage is full. Delete old entries to save new ones.");
    else if(e&&e.code==="unavailable") toast("Connection problem. Try saving again.");
    else toast("Could not save: "+(e&&e.message||"unknown error"));
    return false;
  }
}
const saveSale=(date,entry)=>write(async()=>{const ref=await ensureBook(state.shop,date);await ref.update({sales:{[date]:{...entry,deleted:false,at:Date.now()}}})},"Saved "+niceDate(date));
const deleteSale=date=>write(async()=>{const ref=await ensureBook(state.shop,date);await ref.update({sales:{[date]:{deleted:true,at:Date.now()}}})},"Day entry removed");
async function saveTxn(entry,id,oldDate){
  const nid=id||uid();
  return write(async()=>{
    if(id&&oldDate&&oldDate.slice(0,7)!==entry.date.slice(0,7)){const old=await ensureBook(state.shop,oldDate);await old.update({txns:{[id]:{deleted:true}}})}
    const ref=await ensureBook(state.shop,entry.date);await ref.update({txns:{[nid]:{...entry,deleted:false,at:Date.now()}}})
  },TYPE[entry.type].label+(id?" updated":" saved"));
}
async function savePurchase(entry,id,oldDate,msg){
  const nid=id||uid();
  return write(async()=>{
    if(id&&oldDate&&oldDate.slice(0,7)!==entry.date.slice(0,7)){const old=await ensureBook(state.shop,oldDate);await old.update({purchases:{[id]:{deleted:true}}})}
    const ref=await ensureBook(state.shop,entry.date);await ref.update({purchases:{[nid]:{...entry,deleted:false}}})
  },msg);
}
const updatePurchase=(x,patch,msg)=>write(async()=>{const ref=await ensureBook(state.shop,x.date);await ref.update({purchases:{[x.id]:patch}})},msg);
const deleteTxn=x=>write(async()=>{const ref=await ensureBook(state.shop,x.date);await ref.update({txns:{[x.id]:{deleted:true}}})},"Entry removed");
const saveSettings=next=>write(async()=>{await db.doc("settings/main").set(next)},"Settings saved");

/* ---------- Heads: saved names for expenses, salary staff and parties ----------
   settings.heads[shopId] = {expense:[...], salary:[...], hidden:{expense:[...], salary:[...]}}
   Suggestions = saved heads + every name already used, minus hidden ones, most used first. */
function headCfg(shop){const h=((settings.heads||{})[shop||state.shop])||{};return {expense:h.expense||null,salary:h.salary||[],hidden:h.hidden||{}}}
function headStats(type,shop){
  shop=shop||state.shop;const st={};
  txnsBetween(shop,"0000","9999").filter(x=>x.type===type&&x.name).forEach(x=>{const k=pkey(x.name);const s=st[k]||(st[k]={name:x.name.trim(),n:0,amt:0,last:""});s.n++;s.amt=r2(s.amt+num(x.amount));if(x.date>=s.last){s.last=x.date;s.name=x.name.trim()}});
  return st;
}
function headList(type,shop){
  shop=shop||state.shop;
  if(type==="party"||type==="partyall"){
    const book=partyBook(shop);
    return Object.values(book).sort((a,b)=>(b.bills.length+b.pays.length)-(a.bills.length+a.pays.length)||a.name.localeCompare(b.name)).map(r=>({name:r.name,n:r.bills.length+r.pays.length,saved:!!r.docId}));
  }
  const cfg=headCfg(shop),st=headStats(type,shop),hidden=new Set((cfg.hidden[type]||[]).map(pkey));
  const saved=type==="expense"?(cfg.expense||DEFAULT_CATS):cfg.salary;
  const map={};
  saved.forEach(n=>{const k=pkey(n);map[k]={name:n,n:0,amt:0,saved:true}});
  Object.entries(st).forEach(([k,s])=>{if(map[k]){map[k].n=s.n;map[k].amt=s.amt}else map[k]={name:s.name,n:s.n,amt:s.amt,saved:false}});
  return Object.entries(map).filter(([k])=>!hidden.has(k)).map(([,v])=>v).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
/* Same head typed differently ("rent ", "RENT") → use the saved spelling */
function canonHead(type,name){const k=pkey(name);if(!k)return name.trim();const hit=headList(type).find(h=>pkey(h.name)===k);return hit?hit.name:name.trim().replace(/\s+/g," ")}
async function rememberHead(type,name){
  if(type!=="expense"&&type!=="salary") return;
  const cfg=headCfg(),k=pkey(name);if(!k)return;
  const list=type==="expense"?(cfg.expense||DEFAULT_CATS):cfg.salary;
  const hid=(cfg.hidden[type]||[]).filter(n=>pkey(n)!==k);
  if(list.some(n=>pkey(n)===k)&&hid.length===(cfg.hidden[type]||[]).length) return;
  const nextList=list.some(n=>pkey(n)===k)?list:[...list,name];
  await writeHeads(type,nextList,hid,true);
}
function writeHeads(type,list,hidden,quiet){
  const all={...(settings.heads||{})},cur={...(all[state.shop]||{})};
  cur[type]=list;cur.hidden={...(cur.hidden||{}),[type]:hidden};all[state.shop]=cur;
  return write(async()=>{await db.doc("settings/main").update({heads:all})},quiet?false:"Heads saved");
}

let headsTab="expense";
function renderHeads(){
  const el=$("#headsCard");if(!el)return;
  const type=headsTab,list=headList(type),word=type==="expense"?"expense head":"staff name";
  el.innerHTML=`<div class="card-head"><h2>Heads · ${esc((curShop()||{}).name||"")}</h2></div>
    <p class="muted small" style="margin-top:0">These names show as tap-to-pick suggestions when anyone adds a payment, so the same head is never typed two ways. Renaming also changes every old entry with that name. Parties are managed in Party accounts.</p>

  el.querySelectorAll("[data-ht]").forEach(b=>b.onclick=()=>{headsTab=b.dataset.ht;renderHeads()});
  const savedNow=()=>{const c=headCfg();return {list:[...(type==="expense"?(c.expense||DEFAULT_CATS):c.salary)],hidden:[...(c.hidden[type]||[])]}};
  $("#hd_add").onclick=async()=>{const n=$("#hd_new").value.trim().replace(/\s+/g," ");if(!n)return;
    if(list.some(h=>pkey(h.name)===pkey(n))){toast("Already in the list");return}
    const c=savedNow();c.list.push(n);await writeHeads(type,c.list,c.hidden.filter(x=>pkey(x)!==pkey(n)));renderHeads()};
  $("#hd_new").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#hd_add").click()}};
  el.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{const h=list[+b.dataset.hdel];
    confirmInline(b.parentElement,async()=>{const c=savedNow();await writeHeads(type,c.list.filter(x=>pkey(x)!==pkey(h.name)),[...c.hidden,h.name]);renderHeads()})});
  el.querySelectorAll("[data-hren]").forEach(b=>b.onclick=()=>{const h=list[+b.dataset.hren],tr=b.closest(".hrow");
    tr.innerHTML=`<div style="flex:1"><div class="actions"><input type="text" value="${esc(h.name)}" style="flex:1" autocomplete="off"><button class="btn small">Save</button><button class="link" type="button">Cancel</button></div>${h.n?`<p class="muted small" style="margin:6px 0 0">${h.n} old entr${h.n===1?"y":"ies"} will change to the new name. Using a name that already exists merges the two.</p>`:""}</div>`;
    const inp=tr.querySelector("input");inp.focus();inp.select();
    tr.querySelector(".link").onclick=renderHeads;
    tr.querySelector(".btn").onclick=()=>renameHead(type,h.name,inp.value)});
}
async function renameHead(type,oldName,newName){
  newName=newName.trim().replace(/\s+/g," ");const ok=pkey(oldName);if(!newName||newName===oldName){renderHeads();return}
  const target=headList(type).find(h=>pkey(h.name)===pkey(newName)&&pkey(h.name)!==ok);
  if(target) newName=target.name;
  const c=headCfg();let list=[...(type==="expense"?(c.expense||DEFAULT_CATS):c.salary)].filter(x=>pkey(x)!==ok);
  if(!list.some(x=>pkey(x)===pkey(newName))) list.push(newName);
  const hidden=(c.hidden[type]||[]).filter(x=>pkey(x)!==pkey(newName));
  const hits=txnsBetween(state.shop,"0000","9999").filter(x=>x.type===type&&pkey(x.name)===ok);
  const byMonth={};hits.forEach(x=>{(byMonth[x.date.slice(0,7)]=byMonth[x.date.slice(0,7)]||{date:x.date,txns:{}}).txns[x.id]={name:newName}});
  const done=await write(async()=>{
    for(const m of Object.values(byMonth)){const ref=await ensureBook(state.shop,m.date);await ref.update({txns:m.txns})}
  },false);
  if(!done) return;
  await writeHeads(type,list,hidden,true);
  toast(target?`Merged into ${newName} · ${hits.length} entr${hits.length===1?"y":"ies"} updated`:`Renamed · ${hits.length} entr${hits.length===1?"y":"ies"} updated`);
  renderHeads();
}

/* Tap-to-pick suggestions under a name box */
function attachPicker(input,type){
  if(!input) return;
  input.removeAttribute("list");input.setAttribute("autocomplete","off");
  const box=document.createElement("div");box.className="sugg";input.closest("label").after(box);
  const draw=()=>{
    const q=pkey(input.value),all=headList(type);
    let hits=q?all.filter(h=>pkey(h.name).includes(q)).sort((a,b)=>(pkey(b.name).startsWith(q)-pkey(a.name).startsWith(q))||b.n-a.n):all;
    const exact=q&&all.some(h=>pkey(h.name)===q);

function dayLedger(date){

    <tr class="bf"><td>Opening</td><td class="num r">${f(oc)}</td></tr>

const MAX_PHOTOS=5;
let pform={editId:null,photos:[],vals:{},busy:0};
/* Bill photos are shrunk in the browser and stored in the same database, one document per photo. */
const photoCache={};
async function photoSrc(id){
  if(photoCache[id]) return photoCache[id];
  try{const s=await db.doc("photos/"+id).get();if(s.exists){photoCache[id]=s.data().data;return photoCache[id]}}catch(e){}
  return null;
}
function fillPhotos(root){(root||document).querySelectorAll("img[data-pid]").forEach(async im=>{if(im.dataset.done)return;im.dataset.done="1";const s=await photoSrc(im.dataset.pid);if(s)im.src=s;else im.alt="Photo missing"})}
async function shrink(file){
  if(!/^image\//.test(file.type)) throw {code:"unsupported_type"};
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  for(const [max,qual] of [[1400,.72],[1150,.62],[950,.55],[800,.5]]){
    const s=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(src,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",qual);
    if(url.length<235000) return url;
  }
  throw {code:"too_large"};
}
async function addPhotos(files){
  if(!db){toast("Saving is unavailable here");return}
  const room=MAX_PHOTOS-pform.photos.length;
  const list=[...files].slice(0,room);
  if(files.length>room) toast("Only "+MAX_PHOTOS+" photos per bill. Extra photos were skipped.");
  for(const f of list){
    pform.busy++;renderPhotoStrip();
    try{const data=await shrink(f);const id=uid();await db.doc("photos/"+id).set({shop:state.shop,data,at:Date.now(),by:me().name});photoCache[id]=data;pform.photos.push({id,t:"img"})}
    catch(e){const c=e&&e.code;toast(c==="too_large"?"That photo is too detailed to store. Try a closer, simpler shot.":c==="unsupported_type"?"Use a photo (JPG or PNG).":c==="quota_exceeded"?"Photo storage is full.":"Could not upload a photo. Try again.")}
    pform.busy--;renderPhotoStrip();
  }
}
function renderPhotoStrip(){
  const el=$("#pPhotos");if(!el) return;
  el.innerHTML=pform.photos.map((ph,i)=>`<div class="thumb"><img data-pid="${ph.id}" data-lb="${i}" alt="Bill photo ${i+1}"><button type="button" class="x" data-rm="${i}" aria-label="Remove photo">×</button></div>`).join("")
    +(pform.busy?`<div class="thumb">Uploading…</div>`:"")
    +(pform.photos.length+pform.busy<MAX_PHOTOS?`<label class="thumb add" for="pFile">+ Photo<br>${pform.photos.length}/${MAX_PHOTOS}</label>`:"");
  fillPhotos(el);
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{pform.photos.splice(+b.dataset.rm,1);renderPhotoStrip()});

}

/* Party accounts: every bill adds to what we owe the party, every party payment reduces it.
   A payment can settle chosen bills (settles = {billId: amount}); the rest stays "on account". */
let partyDocs={};
/* settles is stored as a list [{b:billId,a:amount}] so edits replace it whole */
const settleList=t=>Array.isArray(t.settles)?t.settles.map(x=>[x.b,num(x.a)]):Object.entries(t.settles||{}).map(([b,a])=>[b,num(a)]);
const pkey=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function partyBook(shop){
  const map={};
  const get=name=>{const k=pkey(name);return map[k]||(map[k]={key:k,name:String(name).trim(),bills:[],pays:[],opening:0,openingDate:"",phone:"",docId:null})};
  const bills=allPurchases(shop),srs=billSerials(bills);
  bills.forEach(b=>{if(b.party)get(b.party).bills.push({...b,sr:srs[b.id]})});
  txnsBetween(shop,"0000","9999","party").forEach(t=>{if(t.name)get(t.name).pays.push(t)});
  Object.entries(partyDocs).forEach(([id,d])=>{if(d.shop!==shop||d.deleted)return;const r=get(d.name);r.name=d.name;r.opening=num(d.opening);r.openingDate=d.openingDate||"";r.phone=d.phone||"";r.docId=id});
  for(const r of Object.values(map)){
    const paidTo={};let linked=0;
    r.pays.forEach(t=>{for(const [id,a] of settleList(t)){paidTo[id]=r2((paidTo[id]||0)+a);linked+=a}});
    r.bills.forEach(b=>{b.paid=Math.min(num(b.amount),paidTo[b.id]||0);b.due=r2(num(b.amount)-b.paid);b.status=b.due<=0?"Paid":b.paid>0?"Part paid":"Unpaid"});
    r.totalBills=r2(r.bills.reduce((a,b)=>a+num(b.amount),0));
    r.totalPaid=r2(r.pays.reduce((a,t)=>a+num(t.amount),0));
    r.balance=r2(r.opening+r.totalBills-r.totalPaid);
    r.onAccount=r2(r.totalPaid-linked);
    r.openBills=r.bills.filter(b=>b.due>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.sr-b.sr));
  }
  return map;
}
function billSerials(bills){
  const out={};let max=0;
  bills.forEach(b=>{if(b.sr){out[b.id]=b.sr;max=Math.max(max,b.sr)}});
  bills.filter(b=>!b.sr).sort((a,b)=>a.date===b.date?((a.at||0)-(b.at||0)):(a.date<b.date?-1:1)).forEach(b=>{out[b.id]=++max});
  return out;
}

function startSettle(key,billIds){
  const r=partyBook(state.shop)[key];if(!r)return;
  const alloc={};let amt=0;
  billIds.forEach(id=>{const b=r.bills.find(x=>x.id===id);if(b&&b.due>0){alloc[id]=b.due;amt+=b.due}});
  payForm={party:key,alloc,vals:{amount:r2(amt)},open:true};
  state.psub="parties";state.party=key;render();
  setTimeout(()=>{const f=$("#payForm");if(f)f.scrollIntoView({behavior:"smooth",block:"start"})},50);
}

function wirePartyLedger(r,owner){
  const c=$("#partyCard");
  if(payForm.party!==r.key) payForm={party:r.key,alloc:{},vals:{},open:false};
  const form=$("#payForm");
  const readAlloc=()=>{const a={};c.querySelectorAll(".pfamt").forEach(i=>{const v=num(i.value);if(v>0)a[i.dataset.bid]=v});return a};
  const check=()=>{
    payForm.vals={date:$("#pf_date").value,amount:$("#pf_amount").value,mode:$("#pf_mode").value,note:$("#pf_note").value};
    payForm.alloc=readAlloc();
    const amt=num($("#pf_amount").value),linked=r2(Object.values(payForm.alloc).reduce((a,b)=>a+b,0)),el=$("#pfCheck");
    let over=r.openBills.find(b=>(payForm.alloc[b.id]||0)>b.due+0.001);
    if(over){el.className="check off";el.textContent="Sr "+over.sr+" only has "+rs(over.due)+" due.";return false}
    if(!amt){el.className="check";el.textContent=r.openBills.length?"Enter the amount, then tick the bills it pays.":"Enter the amount paid.";return false}
    if(linked>amt){el.className="check off";el.textContent="Bills ticked add up to "+rs(linked)+", more than the "+rs(amt)+" paid.";return false}
    const left=r2(amt-linked);
    el.className="check ok";el.textContent=(linked?"Settles "+rs(linked)+" of bills. ":"")+(left?rs(left)+" goes on account. ":"")+"New balance: "+rs(r.balance-amt)+".";
    return true;
  };
  $("#payToggle").onclick=()=>{payForm.open=!payForm.open;render()};
  const sa=$("#settleAll");if(sa) sa.onclick=()=>startSettle(r.key,r.openBills.map(b=>b.id));
  c.querySelectorAll("[data-settle1]").forEach(b=>b.onclick=()=>startSettle(r.key,[b.dataset.settle1]));
  if(form){
    form.addEventListener("input",e=>{
      if(e.target.classList.contains("pfamt")){const ch=c.querySelector(`.pfchk[data-bid="${e.target.dataset.bid}"]`);if(ch)ch.checked=num(e.target.value)>0}
      if(e.target.classList.contains("pfchk")){const am=c.querySelector(`.pfamt[data-bid="${e.target.dataset.bid}"]`);const b=r.openBills.find(x=>x.id===e.target.dataset.bid);am.value=e.target.checked?b.due:""}
      check()});
    form.addEventListener("change",check);
    const auto=$("#pfAuto");if(auto) auto.onclick=()=>{let left=num($("#pf_amount").value);
      if(!left){left=r2(r.openBills.reduce((a,b)=>a+b.due,0));$("#pf_amount").value=left}
      c.querySelectorAll(".pfamt").forEach(i=>{const b=r.openBills.find(x=>x.id===i.dataset.bid),pay=Math.min(b.due,left);i.value=pay>0?r2(pay):"";left=r2(left-pay);c.querySelector(`.pfchk[data-bid="${b.id}"]`).checked=pay>0});check()};
    const clr=$("#pfClear");if(clr) clr.onclick=()=>{c.querySelectorAll(".pfamt").forEach(i=>i.value="");c.querySelectorAll(".pfchk").forEach(i=>i.checked=false);check()};
    check();
    form.onsubmit=async e=>{e.preventDefault();
      if(!check()){toast("Check the payment amounts");return}
      const amt=num($("#pf_amount").value),settles=payForm.alloc;
      const srs=Object.keys(settles).map(id=>"Sr "+r.bills.find(b=>b.id===id).sr);
      const entry={type:"party",date:$("#pf_date").value,amount:amt,name:r.name,mode:$("#pf_mode").value,note:$("#pf_note").value.trim(),sub:srs.join(", "),settles:Object.entries(settles).map(([b,a])=>({b,a})),by:me().name};
      if(await saveTxn(entry)){payForm={party:r.key,alloc:{},vals:{},open:false};render()}
    };
  }
  c.querySelectorAll("[data-payedit]").forEach(b=>b.onclick=()=>{state.tab="payments";state.pay.editId=b.dataset.payedit;render();window.scrollTo({top:0})});
  const ep=$("#epForm"),eb=$("#editParty");
  if(eb){eb.onclick=()=>{ep.hidden=false};$("#epCancel").onclick=()=>{ep.hidden=true};
    ep.onsubmit=async e=>{e.preventDefault();
      const data={shop:state.shop,name:r.name,opening:num($("#ep_open").value),openingDate:r.openingDate||todayStr(),phone:$("#ep_phone").value.trim(),at:Date.now(),by:me().name};
      const id=r.docId||(state.shop+"_"+slug(r.name)+"-"+uid().slice(-4));
      await write(()=>db.doc("parties/"+id).set(data),"Party saved");}}
}

function renderAccounts(){
  const p=$("#panel"),shop=state.shop,pos=posOn(),{from,to}=state,af=state.af;
  const span=daysBetween(from,to)+1;
  const group=af.group==="auto"?(span>62?"month":"day"):af.group;
  let rows=[];
  if(group==="month"){
    let d=parse(from);d.setDate(1);
    while(fmtD(d)<=to){const y=d.getFullYear(),m=d.getMonth()+1,s=`${y}-${pad(m)}-01`,e=`${y}-${pad(m)}-${pad(lastDay(y,m))}`;
      const a=s<from?from:s,b=e>to?to:e,t=totals(shop,a,b);
      const iss=salesBetween(shop,a,b).filter(x=>issuesOf(x).length).length;
      if(t.days||t.out)rows.push({key:`${y}-${pad(m)}`,label:MON[m-1]+" "+y,end:b,t,iss:iss?[iss+" day"+(iss>1?"s":"")+" need checking"]:[],reading:null});
      d.setMonth(d.getMonth()+1)}
  }else{
    const sm=Object.fromEntries(salesBetween(shop,from,to).map(s=>[s.date,s]));
    const dates=new Set(Object.keys(sm));txnsBetween(shop,from,to).forEach(x=>dates.add(x.date));
    [...dates].sort().forEach(d=>{const s=sm[d];const iss=s?issuesOf(s):(pos?["No sales entry"]:[]);
      rows.push({key:d,label:shortDate(d),end:d,t:totals(shop,d,d),iss,reading:s?readingOf(s):null})});
  }
  const shown=af.issues?rows.filter(r=>r.iss.length):rows;
  const T=totals(shop,from,to),bal=d=>({cash:cashInHand(shop,d),bank:bankBalance(shop,d),due:outstanding(shop,d)});
  const o=bal(addDays(from,-1)),c=bal(to),f=v=>v==null?"—":rs(v);
  const issueCount=rows.filter(r=>r.iss.length).length;
  const showPos=pos&&group==="day";
  p.innerHTML=`<div class="card">

async function exportCsv(from,to){
  const shopName=(curShop()||{}).name||"shop";
  const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[["Date","Kind","Name / category","Detail","Paid by","POS reading","Total sale","Return","Net sale","Cash","UPI","Unpaid","Dues cash","Dues UPI","Payment amount","Galla cash","UPI / bank","Unpaid due","Box opening","Box closing","Cash adjustment","Note"].join(",")];
  const dates=new Set();salesBetween(state.shop,from,to).forEach(s=>dates.add(s.date));txnsBetween(state.shop,from,to).forEach(x=>dates.add(x.date));
  for(const d of [...dates].sort()){
    const s=salesBetween(state.shop,d,d)[0];
    if(s) lines.push([d,"Sales","","","",s.posReading,s.total,s.ret,r2(num(s.total)-num(s.ret)),s.cash,s.upi,s.unpaid,s.duesCash,s.duesUpi,"","","","",s.openBox??"",s.closeBox??"",s.cashAdj||"",s.note].map(q).join(","));
    for(const x of txnsBetween(state.shop,d,d)) lines.push([d,TYPE[x.type].label,x.name,x.sub,x.mode,"","","","","","","","","",x.amount,"","","","","","",x.note].map(q).join(","));
    lines.push([d,"Closing balance","","","","","","","","","","","","","",cashInHand(state.shop,d),bankBalance(state.shop,d),outstanding(state.shop,d),"","","",""].map(q).join(","));
  }
  saveFile(`${slug(shopName)}-cashbook-${from}-to-${to}.csv`,"\ufeff"+lines.join("\n"),"text/csv");
}

const COLS=["settings","books","parties","photos"];
async function downloadBackup(){
  try{setStatus("Preparing backup…");const data={};
    for(const c of COLS){const q=await db.collection(c).get();data[c]={};q.docs.forEach(d=>data[c][d.id]=d.data())}
    saveFile("galla-backup-"+todayStr()+".json",JSON.stringify({app:"galla-cash-book",version:1,exportedAt:new Date().toISOString(),data}),"application/json");
    setStatus("");toast("Backup downloaded")}
  catch(e){setStatus("Could not make the backup: "+(e.message||e.code),true)}

async function restoreBackup(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast("That file is not a cash book backup");return}
  if(!j||j.app!=="galla-cash-book"||!j.data){toast("That file is not a cash book backup");return}
  const items=[];for(const c of COLS)for(const [id,d] of Object.entries(j.data[c]||{}))items.push([c,id,d]);
  let n=0;setStatus("Restoring 0 of "+items.length+" records…");
  try{for(const [c,id,d] of items){await db.doc(c+"/"+id).set(d);n++;setStatus("Restoring "+n+" of "+items.length+" records…")}
    setStatus("");toast("Restored "+n+" records. Log in with your usual passcode.")}
  catch(e){setStatus("Restore stopped after "+n+" records: "+(e.message||e.code)+". Check the Firestore rules, then try again.",true)}
}

/* ---------- Firebase ---------- */
const PREFIX="galla_";
const mapPath=p=>{const s=p.split("/");s[0]=PREFIX+s[0];return s.join("/")};
const wrapSnap=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata});
const wrapErr=(e,cb)=>err=>cb&&cb({code:err.code,message:err.message});
function makeDb(fs){
  const docRef=p=>{const r=fs.doc(mapPath(p));return {id:r.id,path:p,
    get:async()=>wrapSnap(await r.get()),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrapSnap(s)),wrapErr(e,e))}};
  const colRef=p=>{const c=fs.collection(mapPath(p));const wq=q=>({docs:q.docs.map(wrapSnap),size:q.size,empty:q.empty});return {path:p,
    doc:id=>docRef(p+"/"+(id||c.doc().id)),get:async()=>wq(await c.get()),
    onSnapshot:(n,e)=>c.onSnapshot(q=>n(wq(q)),wrapErr(e,e))}};
  return {doc:docRef,collection:colRef};
}

(async function boot(){
  const cfg=window.GALLA_FIREBASE_CONFIG||{};
  if(!window.firebase&&cfg.apiKey&&!/PASTE/.test(cfg.apiKey)){
    setStatus("");$("#panel").innerHTML=`<div class="gate card"><h2>Connect to the internet once</h2><p class="muted">This phone hasn't downloaded the cash book yet. Open the app once with internet; after that it works offline too.</p><button class="btn" onclick="location.reload()">Try again</button></div>`;return}
  if(!window.firebase||!cfg.apiKey||/PASTE/.test(cfg.apiKey)){
    setStatus("");$("#panel").innerHTML=`<div class="gate card"><h2>Connect Firebase</h2><p class="muted">Open <b>index.html</b>, find <b>GALLA_FIREBASE_CONFIG</b> near the top and paste your Firebase project's config there, then upload the file again. The setup guide has the steps.</p></div>`;return}
  setStatus("Connecting to the cash book…");
  try{
    firebase.initializeApp(cfg);
    const fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    await firebase.auth().signInAnonymously();
    db=makeDb(fs);
  }catch(e){
    const c=e&&e.code||"";
    setStatus(c==="auth/operation-not-allowed"||c==="auth/admin-restricted-operation"?"Turn on Anonymous sign-in in Firebase → Authentication → Sign-in method, then reload.":"Could not connect to Firebase: "+(e.message||c)+". Check the internet connection and the config, then reload.",true);
    return}
  canWrite=true;viewerCanEdit=true;
  setStatus("Loading your books…");
  let gotS=false,gotB=false;
  const fail=e=>{
    if(e.code!=="permission-denied"){setStatus("Lost connection ("+e.code+"). Reload the page.",true);return}
    setStatus("");$("#panel").innerHTML=`<div class="gate card"><h2>One step left in Firebase</h2>
      <p class="muted">Firebase is not allowing the cash book to save yet. In the Firebase console open <b>Firestore Database → Rules</b>, paste these 3 lines just below the line <span class="num">match /databases/{database}/documents {</span>, tap <b>Publish</b>, then reload this page.</p>
      <pre class="num" style="background:var(--soft);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px">match /{col}/{docId} {
  allow read, write: if request.auth != null &amp;&amp; col.matches('galla_.*');
}</pre></div>`};
  const ready=()=>{if(gotS&&gotB&&!loaded){loaded=true;setStatus("");render()}};
  db.doc("settings/main").onSnapshot(s=>{settings=s.exists?{shops:[],opening:{},users:[],...s.data()}:{shops:[],opening:{},users:[]};gotS=true;loaded?liveRender():ready()},fail);
  db.collection("parties").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());partyDocs=m;if(loaded)liveRender()},()=>{});
  db.collection("books").onSnapshot(q=>{const nb={};q.docs.forEach(d=>nb[d.id]=d.data());books=nb;gotB=true;loaded?liveRender():ready()},fail);
})();
})();
</script>

<script>
/* ---------- Installable app (PWA) ---------- */
(function(){
  const btn=document.getElementById("installBtn"),hint=document.getElementById("iosHint");
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let deferred=null;

  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{if(w.state==="activated"&&navigator.serviceWorker.controller){
          const t=document.getElementById("toast");t.textContent="App updated. Reopen it to use the new version.";t.hidden=false;setTimeout(()=>t.hidden=true,5000)}})});
    }).catch(()=>{})});
  }
  if(standalone) return;

  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.hidden=false});
  window.addEventListener("appinstalled",()=>{btn.hidden=true;deferred=null});
  if(ios){btn.hidden=false}

  btn.onclick=async()=>{
    if(deferred){deferred.prompt();const r=await deferred.userChoice.catch(()=>null);deferred=null;if(r&&r.outcome==="accepted")btn.hidden=true;return}
    if(ios){hint.hidden=false;return}
    const t=document.getElementById("toast");t.textContent="Open the browser menu (⋮) and tap Install app or Add to Home screen.";t.hidden=false;setTimeout(()=>t.hidden=true,4000);
  };
  document.getElementById("iosHintOk").onclick=()=>{hint.hidden=true};
})();
</script>

</body>
